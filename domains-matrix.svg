<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<defs>
  <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111F"/>
    <stop offset="50%" stop-color="#0D1B2E"/>
    <stop offset="100%" stop-color="#040912"/>
  </linearGradient>
  <linearGradient id="card-fs" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0E2843"/>
    <stop offset="100%" stop-color="#071526"/>
  </linearGradient>
  <linearGradient id="card-da" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#11244E"/>
    <stop offset="100%" stop-color="#08142E"/>
  </linearGradient>
  <linearGradient id="card-ml" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1E1A4E"/>
    <stop offset="100%" stop-color="#0E0C2B"/>
  </linearGradient>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
  </filter>
</defs>

<rect width="1200" height="340" rx="22" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5"/>

<!-- TITLE BAR -->
<g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Arial, sans-serif" text-anchor="middle">
  <text x="600" y="45" font-size="14" font-weight="700" fill="#64748B" letter-spacing="3">TRIAD OF SPECIALIZATION</text>
  <text x="600" y="70" font-size="22" font-weight="800" fill="#F8FAFC" letter-spacing="1">FULL STACK &nbsp;·&nbsp; DATA ANALYTICS &nbsp;·&nbsp; MACHINE LEARNING</text>
</g>

<g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Arial, sans-serif">
  <!-- CARD 1: FULL STACK -->
  <g filter="url(#shadow)">
    <rect x="35" y="95" width="355" height="215" rx="16" fill="url(#card-fs)" stroke="#38BDF8" stroke-width="1.8"/>
    <rect x="55" y="115" width="40" height="40" rx="10" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="75" y="141" font-size="18" text-anchor="middle" fill="#38BDF8">🌐</text>
    <text x="105" y="132" font-size="18" font-weight="800" fill="#F0F9FF">FULL STACK</text>
    <text x="105" y="150" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">WEB &amp; BACKEND ARCHITECTURE</text>
    
    <path d="M55 170H370" stroke="#38BDF8" stroke-width="1" opacity="0.25"/>
    <g fill="#E0F2FE" font-size="13.5" font-weight="500">
      <text x="55" y="195">▸ Modern Web Applications &amp; Interfaces</text>
      <text x="55" y="222">▸ High-Performance RESTful APIs</text>
      <text x="55" y="249">▸ FastAPI · Django · Flask · JavaScript</text>
      <text x="55" y="276">▸ Database Integration &amp; End-to-End Delivery</text>
    </g>
  </g>

  <!-- CARD 2: DATA ANALYTICS -->
  <g filter="url(#shadow)">
    <rect x="422" y="95" width="355" height="215" rx="16" fill="url(#card-da)" stroke="#3B82F6" stroke-width="1.8"/>
    <rect x="442" y="115" width="40" height="40" rx="10" fill="#2563EB" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="462" y="141" font-size="18" text-anchor="middle" fill="#3B82F6">📊</text>
    <text x="492" y="132" font-size="18" font-weight="800" fill="#EFF6FF">DATA ANALYTICS</text>
    <text x="492" y="150" font-size="12" font-weight="700" fill="#60A5FA" letter-spacing="1">INSIGHTS &amp; BUSINESS INTELLIGENCE</text>
    
    <path d="M442 170H757" stroke="#3B82F6" stroke-width="1" opacity="0.25"/>
    <g fill="#DBEAFE" font-size="13.5" font-weight="500">
      <text x="442" y="195">▸ Exploratory Data Analysis &amp; Imputation</text>
      <text x="442" y="222">▸ Interactive Power BI &amp; Tableau Dashboards</text>
      <text x="442" y="249">▸ Advanced DAX, Modeling &amp; KPI Metrics</text>
      <text x="442" y="276">▸ Automated Data Processing &amp; Storytelling</text>
    </g>
  </g>

  <!-- CARD 3: MACHINE LEARNING -->
  <g filter="url(#shadow)">
    <rect x="810" y="95" width="355" height="215" rx="16" fill="url(#card-ml)" stroke="#818CF8" stroke-width="1.8"/>
    <rect x="830" y="115" width="40" height="40" rx="10" fill="#6366F1" fill-opacity="0.2" stroke="#818CF8" stroke-width="1.2"/>
    <text x="850" y="141" font-size="18" text-anchor="middle" fill="#818CF8">🤖</text>
    <text x="880" y="132" font-size="18" font-weight="800" fill="#EEF2FF">MACHINE LEARNING</text>
    <text x="880" y="150" font-size="12" font-weight="700" fill="#A5B4FC" letter-spacing="1">PREDICTIVE DATA SCIENCE</text>
    
    <path d="M830 170H1145" stroke="#818CF8" stroke-width="1" opacity="0.25"/>
    <g fill="#E0E7FF" font-size="13.5" font-weight="500">
      <text x="830" y="195">▸ Supervised &amp; Unsupervised Models</text>
      <text x="830" y="222">▸ Classification, Regression &amp; Clustering</text>
      <text x="830" y="249">▸ Scikit-Learn · NumPy · Pandas Pipelines</text>
      <text x="830" y="276">▸ Model Validation, Tuning &amp; Evaluation</text>
    </g>
  </g>
</g>
</svg>
