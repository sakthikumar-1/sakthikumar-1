<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
<defs>
  <linearGradient id="bg-wf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111F"/>
    <stop offset="50%" stop-color="#0B1B30"/>
    <stop offset="100%" stop-color="#050B14"/>
  </linearGradient>
  <linearGradient id="line-grad" x1="0" x2="1">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="35%" stop-color="#3B82F6"/>
    <stop offset="70%" stop-color="#818CF8"/>
    <stop offset="100%" stop-color="#F59E0B"/>
  </linearGradient>
  <filter id="glow-wf">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1200" height="270" rx="22" fill="url(#bg-wf)" stroke="#1E293B" stroke-width="1.5"/>

<!-- CONNECTING PIPELINE LINE -->
<path d="M150 115H1050" stroke="url(#line-grad)" stroke-width="3.5" opacity="0.85"/>

<g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Arial, sans-serif" text-anchor="middle">
  <!-- GLOWING NODE CIRCLES -->
  <g filter="url(#glow-wf)">
    <circle cx="150" cy="115" r="46" fill="#0A223C" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="450" cy="115" r="46" fill="#0C234C" stroke="#3B82F6" stroke-width="2.5"/>
    <circle cx="750" cy="115" r="46" fill="#1A1D4E" stroke="#818CF8" stroke-width="2.5"/>
    <circle cx="1050" cy="115" r="46" fill="#2E2214" stroke="#F59E0B" stroke-width="2.5"/>
  </g>

  <!-- STEP NUMBERS -->
  <g fill="#FFFFFF" font-size="18" font-weight="800">
    <text x="150" y="122">01</text>
    <text x="450" y="122">02</text>
    <text x="750" y="122">03</text>
    <text x="1050" y="122">04</text>
  </g>

  <!-- TITLES -->
  <g font-size="20" font-weight="800" letter-spacing="1.5">
    <text x="150" y="195" fill="#38BDF8">OBSERVE</text>
    <text x="450" y="195" fill="#60A5FA">ANALYZE</text>
    <text x="750" y="195" fill="#A5B4FC">ENGINEER</text>
    <text x="1050" y="195" fill="#FBBF24">IMPROVE</text>
  </g>

  <!-- SUBTITLES / PROCESS DETAILS -->
  <g font-size="13.5" font-weight="500" fill="#94A3B8">
    <text x="150" y="225">Problem &amp; Data Audits</text>
    <text x="150" y="244" fill="#64748B">Requirement Mapping</text>

    <text x="450" y="225">EDA &amp; Systems Logic</text>
    <text x="450" y="244" fill="#64748B">Schema &amp; Model Design</text>

    <text x="750" y="225">Full-Stack &amp; ML Build</text>
    <text x="750" y="244" fill="#64748B">APIs, Pipelines &amp; Code</text>

    <text x="1050" y="225">Benchmark &amp; Refactor</text>
    <text x="1050" y="244" fill="#64748B">Iterative Refinement</text>
  </g>
</g>
</svg>