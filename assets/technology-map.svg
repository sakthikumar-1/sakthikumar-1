<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop stop-color="#081426"/>
    <stop offset="0.5" stop-color="#0B1B30"/>
    <stop offset="1" stop-color="#050B14"/>
  </linearGradient>
  <filter id="glow-card" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
  </filter>
</defs>
<rect width="1200" height="340" rx="24" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
<g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Arial, sans-serif">
  <!-- CARDS BACKGROUNDS -->
  <g filter="url(#glow-card)">
    <rect x="25" y="25" width="270" height="290" rx="18" fill="#0D2238" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="315" y="25" width="270" height="290" rx="18" fill="#0F2042" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="605" y="25" width="270" height="290" rx="18" fill="#181A42" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="895" y="280" width="280" height="290" rx="18" fill="#282016" stroke="#F59E0B" stroke-width="1.5" transform="translate(0, -255)"/>
  </g>

  <!-- CARD HEADERS -->
  <g font-size="20" font-weight="800" letter-spacing="1">
    <text x="50" y="68" fill="#38BDF8">FULL STACK (FS)</text>
    <text x="340" y="68" fill="#60A5FA">DATA ANALYTICS (DA)</text>
    <text x="630" y="68" fill="#A5B4FC">MACHINE LEARNING (ML)</text>
    <text x="920" y="68" fill="#FBBF24">DATABASES &amp; TOOLS</text>
  </g>

  <!-- SUBTITLES / BADGES -->
  <g font-size="12" font-weight="600" letter-spacing="0.5">
    <text x="50" y="92" fill="#7DD3FC">WEB &amp; BACKEND SYSTEMS</text>
    <text x="340" y="92" fill="#93C5FD">INSIGHTS &amp; VISUALIZATION</text>
    <text x="630" y="92" fill="#C7D2FE">PREDICTIVE INTELLIGENCE</text>
    <text x="920" y="92" fill="#FDE68A">PERSISTENCE &amp; WORKFLOW</text>
  </g>

  <!-- DIVIDER LINES -->
  <path d="M50 106H265" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>
  <path d="M340 106H555" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>
  <path d="M630 106H845" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
  <path d="M920 106H1145" stroke="#F59E0B" stroke-width="1" opacity="0.3"/>

  <!-- CARD 1: FULL STACK -->
  <g fill="#E2E8F0" font-size="16" font-weight="500">
    <text x="50" y="138">⚡ JavaScript · HTML5 · CSS3</text>
    <text x="50" y="172">⚡ FastAPI · Flask · Django</text>
    <text x="50" y="206">⚡ RESTful API Architecture</text>
    <text x="50" y="240">⚡ Full-Cycle Web Apps</text>
    <text x="50" y="274">⚡ Frontend-Backend Sync</text>
  </g>

  <!-- CARD 2: DATA ANALYTICS -->
  <g fill="#E2E8F0" font-size="16" font-weight="500">
    <text x="340" y="138">📊 Power BI &amp; Tableau</text>
    <text x="340" y="172">📊 Exploratory Data Analysis</text>
    <text x="340" y="206">📊 Advanced Excel &amp; DAX</text>
    <text x="340" y="240">📊 Automated ETL Pipelines</text>
    <text x="340" y="274">📊 KPI Dashboards &amp; Metrics</text>
  </g>

  <!-- CARD 3: MACHINE LEARNING -->
  <g fill="#E2E8F0" font-size="16" font-weight="500">
    <text x="630" y="138">🤖 Scikit-Learn Algorithms</text>
    <text x="630" y="172">🤖 Predictive Classification</text>
    <text x="630" y="206">🤖 Regression &amp; Clustering</text>
    <text x="630" y="240">🤖 Feature Engineering</text>
    <text x="630" y="274">🤖 Model Validation &amp; Metrics</text>
  </g>

  <!-- CARD 4: DATABASES & TOOLS -->
  <g fill="#E2E8F0" font-size="16" font-weight="500">
    <text x="920" y="138">🛠️ MySQL &amp; PostgreSQL</text>
    <text x="920" y="172">🛠️ MongoDB Document Store</text>
    <text x="920" y="206">🛠️ Git &amp; GitHub Lifecycle</text>
    <text x="920" y="240">🛠️ VS Code &amp; Jupyter Lab</text>
    <text x="920" y="274">🛠️ Postman API Testing</text>
  </g>
</g>
</svg>